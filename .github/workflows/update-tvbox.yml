name: Update TVBox Config

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: tvbox-config-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update TVBox configuration
        run: python scripts/update_tvbox.py

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "tvbox-bot"
          git config user.email "tvbox-bot@users.noreply.github.com"

          git add tvbox.json active-source.json last-known-good/tvbox.json

          if git diff --cached --quiet; then
            echo "No repository changes."
            exit 0
          fi

          git commit -m "Auto update TVBox production config"
          git push
