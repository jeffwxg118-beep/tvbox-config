name: Update TVBox Config

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: tvbox-config-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update TVBox configuration
        run: python scripts/update_tvbox.py

      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "tvbox-bot"
          git config user.email "tvbox-bot@users.noreply.github.com"

          # 只添加实际存在的生成文件
          if [ -f "tvbox.json" ]; then
            git add tvbox.json
          fi

          if [ -f "active-source.json" ]; then
            git add active-source.json
          fi

          if [ -f "last-known-good/tvbox.json" ]; then
            git add last-known-good/tvbox.json
          fi

          # 没有变化就正常结束
          if git diff --cached --quiet; then
            echo "No repository changes."
            exit 0
          fi

          git commit -m "Auto update TVBox production config"
          git push origin HEAD:main
